[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.49.0",
    "mangum",
    "anthropic>=0.120.2",
    "pyjwt[crypto]>=2.13.0",
    "boto3>=1.34.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "openai>=1.60.0",
    "langsmith>=0.14.17",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Every `async def test_*` runs as an asyncio test without a per-test marker.
asyncio_mode = "auto"
# db._pool is a module global, so every async test and fixture must share one
# event loop: a pool created on one loop cannot be used from another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
